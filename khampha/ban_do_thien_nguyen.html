<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bản đồ thiện nguyện</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Icon -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../ungho.css/trangchu_chiendich.css">
    <link rel="stylesheet" href="../khampha.css/bandothiennguyen.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
</head>

<body>

<div class="map-page">

<div id="header"></div>

<!-- MAIN -->
<div class="map-container">

    <!-- OVERLAY -->
    <div class="map-overlay" id="mapOverlay"></div>

    <!-- PANEL -->
    <div class="map-detail-panel" id="detailPanel">

        <div class="panel-header">
            <span>Chi tiết chiến dịch</span>
            <i class="fa-solid fa-xmark close-btn"></i>
        </div>

        <img id="detailImage" class="panel-img" src="">

        <div class="panel-body">
            <h3 id="detailName"></h3>
            <p class="desc" id="detailDesc"></p>

            <div class="tag" id="detailType"></div>

            <!-- ✅ PROGRESS (đã fix) -->
            <div class="map-progress-box">
                <div class="map-progress-bar">
                    <div class="map-progress-fill"></div>
                </div>
                <span id="progressText"></span>
            </div>

            <div class="info">
                <div><b>Chiến dịch:</b> <span id="detailValue"></span></div>
            </div>

            <button class="btn btn-warning w-100 mt-3">Ủng hộ ngay</button>
        </div>

    </div>

    <!-- MAP -->
    <div class="map-area">
        <div id="map"></div>
    </div>

</div>

<!-- JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="../khampha/bandothiennguyen.js"></script>
<script src="../js/load.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

</body>
</html>
