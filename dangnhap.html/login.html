<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

    <!-- Font -->

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Đăng nhập</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- CSS chung (navbar, footer, layout) -->
<link rel="stylesheet" href="../ungho.css/trangchu_chiendich.css">

<!-- CSS riêng (login) -->
<link rel="stylesheet" href="./dangnhap.css">

</head>
<body>

<!-- HEADER -->
<div id="header"></div>
    <div class="login-container">
        <div class="left">
    <div class="dark-layer"></div>
    <div class="overlay"></div>
    <div class="wave"></div>
<div class="cloud cloud1">
    <img src="../img/gioithieu.img/easy-cloud-drawing-1-removebg-preview.png" alt="cloud">
</div>

<div class="cloud cloud1 clone">
    <img src="../img/gioithieu.img/easy-cloud-drawing-1-removebg-preview.png">
</div>

<div class="cloud cloud2">
    <img src="../img/gioithieu.img/easy-cloud-drawing-1-removebg-preview.png" alt="cloud">
</div>

<div class="cloud cloud2 clone">
    <img src="../img/gioithieu.img/easy-cloud-drawing-1-removebg-preview.png">
</div>

<div class="cloud cloud3">
    <img src="../img/gioithieu.img/easy-cloud-drawing-1-removebg-preview.png" alt="cloud">
</div>

<div class="cloud cloud3 clone">
    <img src="../img/gioithieu.img/easy-cloud-drawing-1-removebg-preview.png">
</div>

        </div>
        <div class="right">
            <div class="form-box">
                <h2>Đăng nhập</h2>
                <form id="loginForm">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="Nhập địa chỉ email">
                    <p class="error" id="loginEmailError"></p>

                    <label>Mật khẩu</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Nhập mật khẩu">
                        <span onclick="togglePassword('password')" class="eye">👁️</span>
                    </div>
                    <p class="error" id="loginPassError"></p>

                    <a href="forgot.html" class="forgot">Quên mật khẩu?</a>
                    <button type="submit" class="login-btn">Đăng nhập</button>
                </form>
                <p class="register-text">
                    Bạn chưa có tài khoản? <a href="./register.html">Đăng ký ngay</a>
                </p>
                <p class="terms-text">
                    Bằng việc tiếp tục bạn đã đồng ý với <a href="./terms.html">Điều khoản sử dụng</a>
                </p>
            </div>
        </div>
    </div>
    <script src="./dangnhap.js"></script>
    <!-- FOOTER -->

<div id="footer"></div>

<!-- JS -->

<script src="../js/load.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
