<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>

    <!-- FONT + ICON -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Bootstrap (LUÔN ĐẦU) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- CSS chung -->
<link rel="stylesheet" href="../ungho.css/trangchu_chiendich.css">

<!-- CSS riêng -->
<link rel="stylesheet" href="./dangnhap.css">
</head>

<body class="login-page">

<!-- HEADER -->
<div id="header"></div>

<!-- CONTENT -->
<div class="login-container">
    <div class="left">
            <div class="dark-layer"></div>
    <div class="overlay"></div>
    <div class="wave"></div>
<div class="cloud cloud1">
    <img src="../img/gioithieu.img/easy-cloud-drawing-1-removebg-preview.png" alt="cloud">
</div>

<div class="cloud cloud1 clone">
    <img src="../img/gioithieu.img/easy-cloud-drawing-1-removebg-preview.png">
</div>

<div class="cloud cloud2">
    <img src="../img/gioithieu.img/easy-cloud-drawing-1-removebg-preview.png" alt="cloud">
</div>

<div class="cloud cloud2 clone">
    <img src="../img/gioithieu.img/easy-cloud-drawing-1-removebg-preview.png">
</div>

<div class="cloud cloud3">
    <img src="../img/gioithieu.img/easy-cloud-drawing-1-removebg-preview.png" alt="cloud">
</div>

<div class="cloud cloud3 clone">
    <img src="../img/gioithieu.img/easy-cloud-drawing-1-removebg-preview.png">
</div>
    </div>

    <div class="right">
        <div class="form-box">

            <h2>Quên mật khẩu</h2>

            <p class="forgot-desc" id="statusMsg">
                Hãy nhập email đã đăng ký. Chúng tôi sẽ gửi mã xác thực.
            </p>

            <form id="forgotForm">
                <!-- STEP 1 -->
                <div id="step1">
                    <label>Email</label>
                    <input type="email" id="forgotEmail" placeholder="Nhập địa chỉ email" required>
                    <p class="error" id="forgotEmailError"></p>
                    <button type="submit" class="login-btn">Gửi mã xác thực</button>
                </div>

                <!-- STEP 2 -->
                <div id="step2" style="display: none" class="fade-in">
                    <label>Nhập mã xác thực</label>

                    <div class="otp-container">
                        <input type="text" class="otp-input" maxlength="1">
                        <input type="text" class="otp-input" maxlength="1">
                        <input type="text" class="otp-input" maxlength="1">
                        <input type="text" class="otp-input" maxlength="1">
                        <input type="text" class="otp-input" maxlength="1">
                        <input type="text" class="otp-input" maxlength="1">
                    </div>

                    <p class="error" id="otpError" style="text-align:center"></p>

                    <label>Mật khẩu mới</label>
                    <div class="password-wrapper">
                        <input type="password" id="newPass" placeholder="Nhập mật khẩu mới">
                        <span onclick="togglePassword('newPass')" class="eye">👁️</span>
                    </div>

                    <button type="button" id="btnVerifyFinal" class="login-btn">
                        Cập nhật mật khẩu
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- FOOTER -->
<div id="footer"></div>

<!-- JS -->
<script src="./dangnhap.js"></script>
<script src="../js/load.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
