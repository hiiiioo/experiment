<!doctype html>

<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Chiến dịch</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <div th:replace="layout/header :: header"></div>

    <section class="container mt-5">
      <h2 class="text-center mb-4" style="color: #ff6a00">
        Danh sách chiến dịch gây quỹ
      </h2>

     <div class="text-center mb-4 filter-tabs">
  <span class="tab active" data-filter="all">Tất cả</span>
  <span class="tab" data-filter="org">Tổ chức</span>
  <span class="tab" data-filter="person">Cá nhân</span>
</div>

<div class="row align-items-center mb-4 g-3">

<!-- LỌC TRẠNG THÁI -->

<div class="col-md-6 d-flex gap-3">

<select id="statusFilter" class="form-select w-auto">
<option value="all">Tất cả trạng thái</option>
<option value="active">Đang thực hiện</option>
<option value="goal">Đạt mục tiêu</option>
<option value="ended">Đã kết thúc</option>
<option value="paused">Tạm dừng</option>
</select>

<button id="resetFilter" class="btn btn-light border">
<i class="fa-solid fa-rotate"></i>
</button>

</div>

<!-- TÌM KIẾM -->

<div class="col-md-6">

<div class="input-group">
<input
type="text"
id="searchCampaign"
class="form-control"
placeholder="Tìm kiếm tên chiến dịch"
/>
<span class="input-group-text">
<i class="fa-solid fa-magnifying-glass"></i>
</span>
</div>

</div>

</div>


      <div class="row g-4">
        
        <!-- CARD 1 -->
<div class="col-md-4 col-lg-3 campaign"
     th:each="campaign : ${campaigns}"
     th:classappend="' ' + ${campaign.type} + ' ' + ${campaign.status}">

  <div class="card shadow-sm h-100 campaign-card">

    <img th:src="@{${campaign.imageUrl}}" class="card-img-top"/>

    <div class="progress-box">

      <span class="money"
            th:text="${campaign.currentAmount} + 'đ'"></span>

      <div class="progress">
        <div class="progress-bar"
             th:style="'width:' + (${campaign.currentAmount}*100/${campaign.targetAmount}) + '%'">
        </div>
      </div>

      <span class="percent"
            th:text="${campaign.currentAmount}*100/${campaign.targetAmount} + '%'">
      </span>

    </div>

    <div class="card-body">

      <h6 th:text="${campaign.title}"></h6>

      <p class="text-muted small">
        <span th:text="${campaign.donationCount}"></span>
        lượt ủng hộ •
        <span th:text="${campaign.endDate}"></span>
      </p>

    </div>

  </div>

</div>

      </div>

      <div class="text-center mt-5">
        <button id="showMore" class="btn btn-warning me-2">Xem thêm</button>

        <button id="collapse" class="btn btn-secondary d-none">Thu gọn</button>
      </div>
    </section>

    <div th:replace="layout/footer :: *"></div>

    

    <script src="/js/script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
