<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thông tin cá nhân</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../ungho.css/trangchu_chiendich.css">
  <link rel="stylesheet" href="../canhan/profile.css">

</head>
<body>

<!-- HEADER LOAD -->
<div id="header"></div>

<!-- MAIN -->
<div class="profile-container">

  <!-- PROFILE HEADER -->
  <div class="profile-header">
    <div class="avatar-box">
      <img id="avatar" src="https://cdn-icons-png.flaticon.com/512/847/847969.png">
      <button class="btn-edit-avatar">
        <i class="fa-solid fa-camera"></i>
      </button>
    </div>

    <div class="info">
      <h2 id="name">Đang tải...</h2>
      <p id="email">Đang tải...</p>

      <button class="btn-edit">
        <i class="fa-solid fa-pen"></i> Chỉnh sửa
      </button>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <h3 id="totalDonate">0₫</h3>
      <p>Tổng đã đóng góp</p>
    </div>

    <div class="stat">
      <h3 id="joined">0</h3>
      <p>Chiến dịch tham gia</p>
    </div>

    <div class="stat">
      <h3 id="created">0</h3>
      <p>Chiến dịch đã tạo</p>
    </div>
  </div>

  <!-- JOINED -->
  <div class="section">
    <h3><i class="fa-solid fa-hand-holding-heart"></i> Chiến dịch đã tham gia</h3>
    <div id="joinedList" class="list-grid"></div>
  </div>

  <!-- CREATED -->
  <div class="section">
    <h3><i class="fa-solid fa-rocket"></i> Chiến dịch đã tạo</h3>
    <div id="createdList" class="list-grid"></div>
  </div>

</div>

<!-- FOOTER LOAD -->
<div id="footer"></div>

<!-- JS -->
<script src="../js/load.js"></script>
<script src="profile.js"></script>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
